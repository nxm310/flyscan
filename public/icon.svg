<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="70%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030509" />
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Plane Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge with Squircle / iOS Curve -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" stroke="#00f2fe" stroke-width="4" stroke-opacity="0.3" />

  <!-- Tactical Concentric Radar Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 6" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-opacity="0.35" />
  <circle cx="256" cy="256" r="90" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="30" fill="none" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.5" />

  <!-- Tactical Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.2" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.2" />

  <!-- Radar Sector Sweep Slice -->
  <path d="M 256 256 L 256 46 A 210 210 0 0 1 437 361 Z" fill="url(#sweepGrad)" />

  <!-- Central Blip Dot -->
  <circle cx="256" cy="256" r="6" fill="#00f2fe" />

  <!-- Target Plane Silhouette with Neon Glow -->
  <g transform="translate(256, 235) scale(1.6)" filter="url(#neonGlow)">
    <path d="M 0 -38 
             L 5 -12 
             L 36 6 
             L 36 12 
             L 6 8 
             L 5 24 
             L 16 33 
             L 16 38 
             L 0 34 
             L -16 38 
             L -16 33 
             L -5 24 
             L -6 8 
             L -36 12 
             L -36 6 
             L -5 -12 Z" 
          fill="#00f2fe" />
    <path d="M 0 -34 L 3 -10 L 0 30 L -3 -10 Z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Live Pulse Dot -->
  <circle cx="340" cy="170" r="7" fill="#ff2e63" />
  <circle cx="340" cy="170" r="14" fill="none" stroke="#ff2e63" stroke-width="2" opacity="0.6" />
</svg>
